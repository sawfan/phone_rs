[package]
name = "phone-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for phone: render tones to WAV files and list the presets."

[[bin]]
name = "phone-mcp"
path = "src/main.rs"

# Spelled out rather than inherited so the crate can also be a member of a
# host workspace (Mnemosyne).
[dependencies]
phone-core = { path = "../phone-core", features = ["schema"] }
phone-tts = { path = "../phone-tts", features = ["schema"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
